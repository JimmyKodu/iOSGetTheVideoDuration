<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS视频时长获取工具 - 5种方案自动切换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8eaff;
            transform: scale(1.02);
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #667eea;
            font-size: 16px;
            font-weight: 500;
        }
        
        .process-list {
            margin-top: 20px;
            display: none;
        }
        
        .process-list.active {
            display: block;
        }
        
        .method-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
        }
        
        .method-item.trying {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }
        
        .method-item.success {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }
        
        .method-item.failed {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        
        .method-name {
            font-weight: 500;
            color: #333;
        }
        
        .method-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .status-waiting {
            background: #e9ecef;
            color: #6c757d;
        }
        
        .status-trying {
            background: #ffc107;
            color: #000;
            animation: pulse 1.5s infinite;
        }
        
        .status-success {
            background: #28a745;
            color: white;
        }
        
        .status-failed {
            background: #dc3545;
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: none;
            text-align: center;
        }
        
        .result.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .result-duration {
            font-size: 36px;
            font-weight: 700;
            margin: 15px 0;
        }
        
        .result-method {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .reset-btn {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
            margin-left: auto;
            margin-right: auto;
        }
        
        .reset-btn.show {
            display: block;
        }
        
        .reset-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .video-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 iOS视频时长获取工具</h1>
        <p class="subtitle">支持iOS转换的MOV格式 | 5种方案自动切换 | 智能超时处理</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽视频文件到此处</div>
            <input type="file" id="fileInput" accept="video/*">
        </div>
        
        <div class="process-list" id="processList">
            <div class="method-item" id="method1">
                <span class="method-name">方案1: loadedmetadata事件</span>
                <span class="method-status status-waiting">等待中</span>
            </div>
            <div class="method-item" id="method2">
                <span class="method-name">方案2: canplay事件</span>
                <span class="method-status status-waiting">等待中</span>
            </div>
            <div class="method-item" id="method3">
                <span class="method-name">方案3: loadeddata事件</span>
                <span class="method-status status-waiting">等待中</span>
            </div>
            <div class="method-item" id="method4">
                <span class="method-name">方案4: durationchange事件</span>
                <span class="method-status status-waiting">等待中</span>
            </div>
            <div class="method-item" id="method5">
                <span class="method-name">方案5: 轮询检测</span>
                <span class="method-status status-waiting">等待中</span>
            </div>
        </div>
        
        <div class="result" id="result">
            <div class="result-title">✅ 成功获取视频时长</div>
            <div class="result-duration" id="durationDisplay">--:--</div>
            <div class="result-method" id="methodDisplay">使用方案: --</div>
            <div class="video-info" id="videoInfo"></div>
        </div>
        
        <div class="error" id="error">
            <strong>错误：</strong><span id="errorMessage"></span>
        </div>
        
        <button class="reset-btn" id="resetBtn">重新选择视频</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processList = document.getElementById('processList');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const resetBtn = document.getElementById('resetBtn');
        const durationDisplay = document.getElementById('durationDisplay');
        const methodDisplay = document.getElementById('methodDisplay');
        const videoInfo = document.getElementById('videoInfo');
        const errorMessage = document.getElementById('errorMessage');

        // 超时时间设置（毫秒）
        const TIMEOUT_MS = 5000;

        // 方法配置
        const methods = [
            { id: 'method1', name: '方案1: loadedmetadata事件', event: 'loadedmetadata' },
            { id: 'method2', name: '方案2: canplay事件', event: 'canplay' },
            { id: 'method3', name: '方案3: loadeddata事件', event: 'loadeddata' },
            { id: 'method4', name: '方案4: durationchange事件', event: 'durationchange' },
            { id: 'method5', name: '方案5: 轮询检测', event: null }
        ];

        // 上传区域点击
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 拖拽支持
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('video/')) {
                handleFile(file);
            }
        });

        // 重置按钮
        resetBtn.addEventListener('click', () => {
            location.reload();
        });

        // 格式化时长
        function formatDuration(seconds) {
            if (isNaN(seconds) || seconds === Infinity) {
                return '--:--';
            }
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hours > 0) {
                return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        // 更新方法状态
        function updateMethodStatus(methodId, status) {
            const element = document.getElementById(methodId);
            const statusSpan = element.querySelector('.method-status');
            
            // 移除所有状态类
            element.classList.remove('trying', 'success', 'failed');
            statusSpan.classList.remove('status-waiting', 'status-trying', 'status-success', 'status-failed');
            
            // 添加新状态
            if (status === 'trying') {
                element.classList.add('trying');
                statusSpan.classList.add('status-trying');
                statusSpan.textContent = '尝试中...';
            } else if (status === 'success') {
                element.classList.add('success');
                statusSpan.classList.add('status-success');
                statusSpan.textContent = '✓ 成功';
            } else if (status === 'failed') {
                element.classList.add('failed');
                statusSpan.classList.add('status-failed');
                statusSpan.textContent = '✗ 超时';
            }
        }

        // 显示结果
        function showResult(duration, methodName, file) {
            durationDisplay.textContent = formatDuration(duration);
            methodDisplay.textContent = `使用方案: ${methodName}`;
            videoInfo.innerHTML = `
                文件名: ${file.name}<br>
                文件大小: ${(file.size / 1024 / 1024).toFixed(2)} MB<br>
                文件类型: ${file.type || '未知'}
            `;
            result.classList.add('show');
            resetBtn.classList.add('show');
        }

        // 显示错误
        function showError(message) {
            errorMessage.textContent = message;
            error.classList.add('show');
            resetBtn.classList.add('show');
        }

        // 方法1-4: 基于事件的方法
        function tryEventMethod(file, eventName) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                
                const timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('超时'));
                }, TIMEOUT_MS);

                const cleanup = () => {
                    clearTimeout(timeoutId);
                    video.removeEventListener(eventName, onEvent);
                    video.removeEventListener('error', onError);
                    video.src = '';
                    video.load();
                };

                const onEvent = () => {
                    if (video.duration && video.duration !== Infinity && !isNaN(video.duration)) {
                        cleanup();
                        resolve(video.duration);
                    }
                };

                const onError = (e) => {
                    cleanup();
                    reject(new Error('视频加载错误'));
                };

                video.addEventListener(eventName, onEvent);
                video.addEventListener('error', onError);
                
                try {
                    video.src = URL.createObjectURL(file);
                } catch (e) {
                    cleanup();
                    reject(e);
                }
            });
        }

        // 方法5: 轮询检测
        function tryPollingMethod(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                
                const startTime = Date.now();
                let pollInterval;

                const cleanup = () => {
                    if (pollInterval) {
                        clearInterval(pollInterval);
                    }
                    video.src = '';
                    video.load();
                };

                const checkDuration = () => {
                    if (Date.now() - startTime > TIMEOUT_MS) {
                        cleanup();
                        reject(new Error('超时'));
                        return;
                    }

                    if (video.duration && video.duration !== Infinity && !isNaN(video.duration)) {
                        cleanup();
                        resolve(video.duration);
                    }
                };

                video.addEventListener('error', () => {
                    cleanup();
                    reject(new Error('视频加载错误'));
                });

                try {
                    video.src = URL.createObjectURL(file);
                    video.load();
                    
                    // 每100ms检测一次
                    pollInterval = setInterval(checkDuration, 100);
                } catch (e) {
                    cleanup();
                    reject(e);
                }
            });
        }

        // 处理文件
        async function handleFile(file) {
            // 重置UI
            processList.classList.add('active');
            result.classList.remove('show');
            error.classList.remove('show');
            resetBtn.classList.remove('show');

            console.log('开始处理视频文件:', file.name, file.type, file.size);

            // 依次尝试5种方法
            for (let i = 0; i < methods.length; i++) {
                const method = methods[i];
                updateMethodStatus(method.id, 'trying');
                
                console.log(`尝试${method.name}...`);

                try {
                    let duration;
                    
                    if (method.event) {
                        // 方法1-4: 基于事件
                        duration = await tryEventMethod(file, method.event);
                    } else {
                        // 方法5: 轮询
                        duration = await tryPollingMethod(file);
                    }

                    console.log(`${method.name} 成功! 时长: ${duration}秒`);
                    updateMethodStatus(method.id, 'success');
                    showResult(duration, method.name, file);
                    return;
                } catch (err) {
                    console.log(`${method.name} 失败:`, err.message);
                    updateMethodStatus(method.id, 'failed');
                }
            }

            // 所有方法都失败
            console.error('所有方法都失败了');
            showError('无法获取视频时长，所有方法均已超时或失败。请尝试其他视频文件。');
        }
    </script>
</body>
</html>
